<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal de Ponto Biométrico | Leitor de Digital</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-hidden justify-between">

  <!-- Header Superior -->
  <header class="px-6 py-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 backdrop-blur">
    <div class="flex items-center space-x-3">
      <div class="h-11 w-11 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-fingerprint text-white text-2xl"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold text-white tracking-wide">Ponto Biométrico • Leitor de Digital</h1>
        <p class="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Terminal Ativo na Empresa
        </p>
      </div>
    </div>

    <!-- Relógio Digital Grande -->
    <div class="flex items-center space-x-5">
      <div class="text-right">
        <div id="totem-clock" class="text-2xl sm:text-3xl font-mono font-bold text-emerald-400 tracking-wider">--:--:--</div>
        <div id="totem-date" class="text-xs text-slate-400 capitalize">--/--/----</div>
      </div>
      <button onclick="toggleFullscreen()" class="p-2.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700" title="Tela Cheia">
        <i class="fa-solid fa-expand text-base" id="fs-icon"></i>
      </button>
      <a href="/" class="p-2.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700" title="Voltar ao Painel">
        <i class="fa-solid fa-gear text-base"></i>
      </a>
    </div>
  </header>

  <!-- Área Central: Scanner Biométrico de Impressão Digital -->
  <main class="flex-1 flex flex-col items-center justify-center p-6 relative max-w-lg mx-auto w-full">

    <!-- Card Principal do Scanner -->
    <div class="w-full bg-slate-900/90 border-2 border-slate-800 rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center space-y-6">

      <div>
        <h2 class="text-xl font-bold text-white">Marcar Presença</h2>
        <p class="text-xs text-slate-400 mt-1">Coloque o dedo no leitor biométrico ou selecione o seu código</p>
      </div>

      <!-- Animação do Leitor Biométrico (Scanner) -->
      <div onclick="triggerFingerprintScan()" class="relative cursor-pointer group my-2">
        <!-- Círculo de Pulso -->
        <div id="finger-pulse" class="absolute -inset-4 rounded-full bg-emerald-500/20 blur-xl group-hover:bg-emerald-500/30 transition-all duration-500 animate-pulse"></div>

        <!-- Botão do Scanner -->
        <div id="finger-circle" class="relative h-44 w-44 rounded-full bg-slate-950 border-4 border-emerald-500/60 flex flex-col items-center justify-center shadow-2xl shadow-emerald-500/20 group-hover:border-emerald-400 group-hover:scale-105 transition-all duration-300">
          <i id="finger-icon" class="fa-solid fa-fingerprint text-6xl text-emerald-400 group-hover:text-emerald-300 transition-colors"></i>
          <span id="finger-hint" class="text-[11px] font-bold text-emerald-400/80 uppercase tracking-widest mt-2">Toque o Dedo</span>
        </div>
      </div>

      <!-- Seletor de Colaborador (Rápido) -->
      <div class="w-full space-y-2 text-left">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Identificação do Colaborador:</label>
        <select id="employee-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 font-medium">
          <option value="">-- Carregando colaboradores... --</option>
        </select>
      </div>

      <!-- Tipo de Marcação: Entrada / Saída -->
      <div class="grid grid-cols-2 gap-3 w-full">
        <label class="cursor-pointer">
          <input type="radio" name="punch_type" value="CHECK_IN" checked class="peer sr-only">
          <div class="peer-checked:bg-emerald-600/20 peer-checked:border-emerald-500 peer-checked:text-emerald-400 border border-slate-700 bg-slate-950/60 rounded-xl p-3 text-center transition">
            <i class="fa-solid fa-arrow-right-to-bracket text-base mb-1 block"></i>
            <span class="text-xs font-bold">Entrada</span>
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="punch_type" value="CHECK_OUT" class="peer sr-only">
          <div class="peer-checked:bg-teal-600/20 peer-checked:border-teal-500 peer-checked:text-teal-400 border border-slate-700 bg-slate-950/60 rounded-xl p-3 text-center transition">
            <i class="fa-solid fa-arrow-right-from-bracket text-base mb-1 block"></i>
            <span class="text-xs font-bold">Saída</span>
          </div>
        </label>
      </div>

      <!-- Botão de Confirmação -->
      <button id="btn-punch" onclick="triggerFingerprintScan()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/20 text-sm transition flex items-center justify-center gap-2 active:scale-98">
        <i class="fa-solid fa-fingerprint text-lg"></i>
        <span>Picar o Dedo / Confirmar Ponto</span>
      </button>

    </div>

  </main>

  <!-- Rodapé -->
  <footer class="py-3 text-center text-xs text-slate-500 border-t border-slate-900 bg-slate-950/80">
    Terminal de Ponto Biométrico • Modo Impressão Digital Exclusiva
  </footer>

  <!-- Modal / Tela de Confirmação do Ponto (Sucesso / Alerta) -->
  <div id="feedback-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div id="feedback-card" class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center space-y-5">
      <div id="feedback-icon" class="h-20 w-20 rounded-full mx-auto flex items-center justify-center text-4xl shadow-xl"></div>
      
      <div>
        <span id="feedback-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></span>
        <h3 id="feedback-name" class="text-2xl font-bold text-white mt-2"></h3>
        <p id="feedback-dept" class="text-xs text-slate-400 mt-0.5"></p>
      </div>

      <div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800 text-left space-y-2 text-xs">
        <div class="flex justify-between">
          <span class="text-slate-400">Horário:</span>
          <span id="feedback-time" class="font-mono text-emerald-400 font-bold"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-400">Autenticação:</span>
          <span class="font-bold text-emerald-400">Digital Validada ✓</span>
        </div>
      </div>

      <p id="feedback-msg" class="text-xs text-slate-300"></p>
    </div>
  </div>

  <script src="/static/totem.js"></script>
</body>
</html>
